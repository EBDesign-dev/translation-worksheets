<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Translation Worksheets — Inclusive Learning Supports</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #faf8f2; color: #1a1a1a; min-height: 100vh; }

  nav { background: #faf8f2; border-bottom: 1px solid #e8e4d8; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .nav-logo { font-size: 15px; font-weight: 600; color: #1a1a1a; text-decoration: none; }
  .nav-back { font-size: 13px; color: #888; text-decoration: none; display: flex; align-items: center; gap: 6px; padding: 7px 16px; border: 1px solid #e0ddd4; border-radius: 999px; transition: all 0.15s; }
  .nav-back:hover { background: #f0ece0; color: #1a1a1a; }

  .hero { padding: 48px 32px 32px; max-width: 960px; margin: 0 auto; }
  .hero-eyebrow { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #aaa; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .hero-eyebrow::before { content: ''; display: block; width: 20px; height: 1px; background: #aaa; }
  .hero h1 { font-size: 36px; font-weight: 600; color: #1a1a1a; margin-bottom: 10px; line-height: 1.2; }
  .hero p { font-size: 15px; color: #888; line-height: 1.6; }

  .tabs-section { max-width: 960px; margin: 0 auto; padding: 0 32px 48px; }
  .lang-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .lang-tab { padding: 8px 20px; border-radius: 999px; border: 1px solid #d9d4c7; font-size: 13px; font-weight: 500; cursor: pointer; background: #faf8f2; color: #888; transition: all 0.15s; font-family: inherit; }
  .lang-tab.active { background: #1a1a1a; color: #faf8f2; border-color: #1a1a1a; }
  .lang-tab:hover:not(.active) { background: #f0ece0; color: #1a1a1a; }

  .count-pill { display: inline-block; padding: 4px 12px; border-radius: 999px; background: #f0ece0; font-size: 11px; color: #888; margin-bottom: 20px; margin-top: 10px; }

  .slider-outer { position: relative; padding: 0 20px; }
  .cards-track { display: flex; gap: 14px; overflow-x: auto; scroll-behavior: smooth; scroll-snap-type: x mandatory; padding-bottom: 12px; }
  .cards-track::-webkit-scrollbar { height: 3px; }
  .cards-track::-webkit-scrollbar-thumb { background: #d9d4c7; border-radius: 4px; }

  .ws-card { min-width: 160px; max-width: 160px; background: #fff; border: 1px solid #e8e4d8; border-radius: 16px; overflow: hidden; scroll-snap-align: start; flex-shrink: 0; transition: transform 0.15s, box-shadow 0.15s; }
  .ws-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
